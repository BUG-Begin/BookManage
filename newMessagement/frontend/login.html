<!-- 登录页面 -->
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="fa fa-book fa-4x text-primary"></i>
            <h2 class="mt-2">图书管理系统</h2>
            <p class="text-muted">请登录您的账号</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="loginType" class="form-label">登录类型</label>
                <select class="form-control" id="loginType" name="loginType" required>
                    <option value="admin">管理员</option>
                    <option value="reader">读者</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe">
                <label class="form-check-label" for="rememberMe">记住我</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>
        
        <div class="text-center mt-4 text-muted">
            <p>版权所有 © 2023 图书管理系统</p>
        </div>
    </div>
</div>
