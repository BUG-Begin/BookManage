<!-- 图书管理页面 -->
<div class="books-content">
    <div class="page-header">
        <h2 class="page-title">图书管理</h2>
        <p class="page-subtitle">管理系统中的图书信息</p>
    </div>
    
    <!-- 搜索和添加图书按钮 -->
    <div class="search-container">
        <input type="text" id="bookSearch" placeholder="搜索图书...">
        <button id="addBookBtn" class="btn btn-primary">
            <i class="fa fa-plus"></i> 添加图书
        </button>
    </div>
    
    <!-- 图书列表 -->
    <div class="table-container">
        <table id="booksTable" class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ISBN</th>
                    <th>书名</th>
                    <th>作者</th>
                    <th>分类</th>
                    <th>出版商</th>
                    <th>总数量</th>
                    <th>可借数量</th>
                    <th>出版日期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="booksTableBody">
                <!-- 图书数据将通过JavaScript加载 -->
            </tbody>
        </table>
    </div>
    
    <!-- 分页 -->
    <div class="pagination-container">
        <ul id="booksPagination" class="pagination">
            <!-- 分页按钮将通过JavaScript加载 -->
        </ul>
    </div>
</div>

<!-- 添加/编辑图书模态框 -->
<div id="bookModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h4 id="bookModalTitle">添加图书</h4>
            <button type="button" class="close-btn" data-bs-dismiss="modal">&times;</button>
        </div>
        <form id="bookForm">
            <div class="form-group">
                <label for="bookISBN">ISBN</label>
                <input type="text" id="bookISBN" name="ISBN" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="bookTitle">书名</label>
                <input type="text" id="bookTitle" name="title" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="bookAuthor">作者</label>
                <input type="text" id="bookAuthor" name="author" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="bookCategory">分类</label>
                <select id="bookCategory" name="category_id" class="form-control" required>
                    <!-- 分类选项将通过JavaScript加载 -->
                </select>
            </div>
            <div class="form-group">
                <label for="bookPublisher">出版商</label>
                <select id="bookPublisher" name="publisher_id" class="form-control" required>
                    <!-- 出版商选项将通过JavaScript加载 -->
                </select>
            </div>
            <div class="form-group">
                <label for="bookTotalCopies">总数量</label>
                <input type="number" id="bookTotalCopies" name="total_copies" class="form-control" min="1" required>
            </div>
            <div class="form-group">
                <label for="bookAvailableCopies">可借数量</label>
                <input type="number" id="bookAvailableCopies" name="available_copies" class="form-control" min="0" required>
            </div>
            <div class="form-group">
                <label for="bookDescription">描述</label>
                <textarea id="bookDescription" name="description" class="form-control"></textarea>
            </div>
            <div class="form-group">
                <label for="bookPublishDate">出版日期</label>
                <input type="date" id="bookPublishDate" name="publish_date" class="form-control">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
