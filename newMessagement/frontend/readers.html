<!-- 读者管理页面 -->
<div class="readers-content">
    <div class="page-header">
        <h2 class="page-title">读者管理</h2>
        <p class="page-subtitle">管理系统中的读者信息</p>
    </div>
    
    <!-- 搜索和添加读者按钮 -->
    <div class="search-container">
        <input type="text" id="readerSearch" placeholder="搜索读者...">
        <button id="addReaderBtn" class="btn btn-primary">
            <i class="fa fa-plus"></i> 添加读者
        </button>
    </div>
    
    <!-- 读者列表 -->
    <div class="table-container">
        <table id="readersTable" class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>电话</th>
                    <th>邮箱</th>
                    <th>地址</th>
                    <th>注册日期</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="readersTableBody">
                <!-- 读者数据将通过JavaScript加载 -->
            </tbody>
        </table>
    </div>
    
    <!-- 分页 -->
    <div class="pagination-container">
        <ul id="readersPagination" class="pagination">
            <!-- 分页按钮将通过JavaScript加载 -->
        </ul>
    </div>
</div>

<!-- 添加/编辑读者模态框 -->
<div id="readerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h4 id="readerModalTitle">添加读者</h4>
            <button type="button" class="close-btn" data-bs-dismiss="modal">&times;</button>
        </div>
        <form id="readerForm">
            <div class="form-group">
                <label for="readerStudentId">学号</label>
                <input type="text" id="readerStudentId" name="student_id" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="readerName">姓名</label>
                <input type="text" id="readerName" name="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="readerPhone">电话</label>
                <input type="text" id="readerPhone" name="phone" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="readerEmail">邮箱</label>
                <input type="email" id="readerEmail" name="email" class="form-control">
            </div>
            <div class="form-group">
                <label for="readerAddress">地址</label>
                <input type="text" id="readerAddress" name="address" class="form-control">
            </div>
            <div class="form-group">
                <label for="readerRegistrationDate">注册日期</label>
                <input type="date" id="readerRegistrationDate" name="registration_date" class="form-control">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
