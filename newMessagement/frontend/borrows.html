<!-- 借阅管理页面 -->
<div class="borrows-content">
    <div class="page-header">
        <h2 class="page-title">借阅管理</h2>
        <p class="page-subtitle">管理系统中的借阅记录</p>
    </div>
    
    <!-- 搜索和添加借阅按钮 -->
    <div class="search-container">
        <input type="text" id="borrowSearch" placeholder="搜索借阅记录...">
        <select id="borrowStatus">
            <option value="">所有状态</option>
            <option value="active">已借出</option>
            <option value="returned">已归还</option>
        </select>
        <button id="addBorrowBtn" class="btn btn-primary">
            <i class="fa fa-plus"></i> 新借阅
        </button>
    </div>
    
    <!-- 借阅记录列表 -->
    <div class="table-container">
        <table id="borrowsTable" class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>读者</th>
                    <th>学号</th>
                    <th>图书</th>
                    <th>ISBN</th>
                    <th>借阅日期</th>
                    <th>应还日期</th>
                    <th>归还日期</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="borrowsTableBody">
                <!-- 借阅数据将通过JavaScript加载 -->
            </tbody>
        </table>
    </div>
    
    <!-- 分页 -->
    <div class="pagination-container">
        <ul id="borrowsPagination" class="pagination">
            <!-- 分页按钮将通过JavaScript加载 -->
        </ul>
    </div>
</div>

<!-- 添加借阅模态框 -->
<div id="borrowModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h4 id="borrowModalTitle">添加借阅记录</h4>
            <button type="button" class="close-btn" data-bs-dismiss="modal">&times;</button>
        </div>
        <form id="borrowForm">
            <div class="form-group">
                <label for="borrowReader">读者</label>
                <select id="borrowReader" name="reader_id" class="form-control" required>
                    <!-- 读者选项将通过JavaScript加载 -->
                </select>
            </div>
            <div class="form-group">
                <label for="borrowBook">图书</label>
                <select id="borrowBook" name="book_id" class="form-control" required>
                    <!-- 图书选项将通过JavaScript加载 -->
                </select>
            </div>
            <div class="form-group">
                <label for="borrowDate">借阅日期</label>
                <input type="date" id="borrowDate" name="borrow_date" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="dueDate">应还日期</label>
                <input type="date" id="dueDate" name="due_date" class="form-control" required>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>
