<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试图书保存功能</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>测试图书保存功能</h1>
    <button onclick="testBookSave()">测试保存图书</button>
    <div id="result"></div>

    <script>
        async function testBookSave() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '正在测试...';

            try {
                // 测试保存一本新书
                const newBook = {
                    isbn: '9787121385978',
                    title: '测试图书',
                    author: '测试作者',
                    publisher_id: 1,
                    category_id: 1,
                    total_copies: 5,
                    available_copies: 5,
                    publish_date: '2023-01-01',
                    description: '这是一本测试图书'
                };

                const response = await axios.post('http://localhost:5001/api/books', newBook, {
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.status === 201) {
                    resultDiv.innerHTML = `
                        <h3>测试成功！</h3>
                        <p>图书保存成功，返回状态码：${response.status}</p>
                        <p>新书信息：</p>
                        <pre>${JSON.stringify(response.data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <h3>测试失败！</h3>
                        <p>返回状态码：${response.status}</p>
                        <p>响应：${JSON.stringify(response.data)}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>测试失败！</h3>
                    <p>错误信息：${error.message}</p>
                    ${error.response ? `<p>响应：${JSON.stringify(error.response.data)}</p>` : ''}
                `;
            }
        }
    </script>
</body>
</html>
